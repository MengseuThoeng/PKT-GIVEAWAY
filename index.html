<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PKT Giveaway</title>
  <link rel="icon" href="pngkt.png" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:linear-gradient(160deg,#f9a8d4 0%,#f3e8ff 100%);min-height:100vh;font-family:'Inter',sans-serif}
    #app{max-width:480px;margin:0 auto;padding-bottom:40px}

    .topbar{background:#D4537E;padding:20px 16px 14px;border-radius:0 0 28px 28px;margin-bottom:16px;box-shadow:0 4px 20px rgba(212,83,126,0.3)}
    .topbar-logo{display:block;width:72px;height:72px;object-fit:contain;margin:0 auto 8px;border-radius:50%;background:rgba(255,255,255,0.15);padding:6px}
    .topbar-title{font-size:22px;font-weight:700;color:#fff;text-align:center;margin-bottom:2px;letter-spacing:-0.3px}
    .topbar-sub{font-size:13px;color:#F4C0D1;text-align:center;margin-bottom:16px}
    .search-box{position:relative}
    .search-box input{width:100%;background:rgba(255,255,255,0.18);border:1.5px solid rgba(255,255,255,0.35);border-radius:14px;padding:11px 40px 11px 14px;font-size:14px;color:#fff;outline:none;transition:border 0.2s}
    .search-box input:focus{border-color:rgba(255,255,255,0.7)}
    .search-box input::placeholder{color:rgba(255,255,255,0.6)}
    .search-icon{position:absolute;right:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:#fff;opacity:0.75;pointer-events:none;fill:none}

    .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px;margin-bottom:16px}
    .stat-box{background:rgba(255,255,255,0.55);border:1px solid rgba(212,83,126,0.2);border-radius:14px;padding:12px 10px;text-align:center;backdrop-filter:blur(8px)}
    .stat-num{font-size:24px;font-weight:700;color:#72243E;line-height:1}
    .stat-lbl{font-size:11px;color:#993556;margin-top:3px;font-weight:500}

    .list{padding:0 16px;display:flex;flex-direction:column;gap:10px}
    .card{background:rgba(255,255,255,0.75);border:1px solid rgba(212,83,126,0.18);border-radius:18px;padding:14px;cursor:pointer;backdrop-filter:blur(8px);transition:transform 0.15s,background 0.15s}
    .card:active{transform:scale(0.98);background:rgba(251,234,240,0.9)}
    .card-top{display:flex;align-items:center;gap:11px;margin-bottom:10px}
    .avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#F4C0D1,#ED93B1);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#4B1528;flex-shrink:0;letter-spacing:-0.5px}
    .card-name{font-size:15px;font-weight:700;color:#3d1a28;line-height:1.2}
    .card-user{font-size:12px;color:#993556;margin-top:2px;font-weight:500}
    .card-comment{font-size:13px;color:#5a3848;line-height:1.5;border-left:2.5px solid #ED93B1;padding-left:10px;margin-bottom:10px;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-style:italic}
    .card-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
    .tag{background:rgba(244,192,209,0.4);border:1px solid rgba(237,147,177,0.5);border-radius:99px;padding:3px 9px;font-size:11px;color:#72243E;font-weight:500}
    .card-footer{display:flex;align-items:center;justify-content:space-between}
    .badge-manual{background:#ED93B1;color:#4B1528;border-radius:99px;padding:4px 11px;font-size:11px;font-weight:700}
    .badge-comment{background:rgba(244,192,209,0.35);color:#72243E;border-radius:99px;padding:4px 11px;font-size:11px;font-weight:700;border:1px solid rgba(237,147,177,0.5)}
    .view-btn{background:#D4537E;color:#fff;border-radius:99px;padding:7px 16px;font-size:12px;font-weight:700;border:none;cursor:pointer;transition:background 0.15s}
    .view-btn:active{background:#993556}

    .empty{text-align:center;padding:48px 20px;color:#993556;font-size:15px;font-weight:500}
    .error{text-align:center;padding:48px 20px;color:#A32D2D;font-size:14px;font-weight:500;line-height:1.8}

    .overlay{position:fixed;inset:0;background:rgba(75,21,40,0.45);display:none;align-items:flex-end;justify-content:center;z-index:200;backdrop-filter:blur(3px)}
    .overlay.open{display:flex}
    .sheet{background:#fff;border-radius:28px 28px 0 0;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding-bottom:32px;animation:slideUp 0.3s ease}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .sheet-handle{width:40px;height:4px;background:#F4C0D1;border-radius:99px;margin:14px auto 8px}
    .sheet-close-row{display:flex;justify-content:flex-end;padding:0 16px 4px}
    .close-btn{background:rgba(244,192,209,0.3);border:none;cursor:pointer;color:#993556;font-size:18px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}
    .sheet-header{padding:4px 20px 16px;border-bottom:1px solid #F4C0D1;display:flex;align-items:center;gap:14px}
    .sheet-avatar{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#F4C0D1,#ED93B1);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#4B1528;flex-shrink:0}
    .sheet-name{font-size:19px;font-weight:700;color:#3d1a28}
    .sheet-user{font-size:13px;color:#993556;margin-top:3px;font-weight:500}
    .sheet-body{padding:16px 20px}
    .field{margin-bottom:16px}
    .field-lbl{font-size:10px;color:#993556;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:5px;font-weight:700}
    .field-val{font-size:14px;color:#3d1a28;word-break:break-word;line-height:1.6}
    .sheet-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
    .profile-btn{display:block;width:calc(100% - 40px);margin:8px 20px 0;background:#D4537E;color:#fff;text-align:center;padding:15px;border-radius:16px;font-size:16px;font-weight:700;text-decoration:none;transition:background 0.15s}
    .profile-btn:active{background:#993556}

    .scroll-top{position:fixed;bottom:20px;right:20px;background:#D4537E;color:#fff;border:none;width:44px;height:44px;border-radius:50%;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:100;box-shadow:0 4px 16px rgba(212,83,126,0.4)}
    .scroll-top:active{background:#993556}

    .loading{text-align:center;padding:48px 20px;color:#993556}
    .spinner{width:36px;height:36px;border:3px solid #F4C0D1;border-top-color:#D4537E;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>

<div id="app">
  <div class="topbar">
    <img src="LogoPKTWhite.png" alt="PKT Logo" class="topbar-logo" onerror="this.style.display='none'" />
    <div class="topbar-title">PKT Giveaway</div>
    <div class="topbar-sub" id="sub-text">Loading participants...</div>
    <div class="search-box">
      <input type="text" id="search" placeholder="Search username or name..." disabled />
      <svg class="search-icon" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </div>
  </div>

  <div class="stats-row" id="stats"></div>

  <div class="list" id="list">
    <div class="loading">
      <div class="spinner"></div>
      Loading...
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-close-row">
        <button class="close-btn" id="closeBtn">&#x2715;</button>
      </div>
      <div id="sheet-content"></div>
    </div>
  </div>
</div>

<button class="scroll-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">&#8593;</button>

<script>
  let users = [];
  let currentList = [];

  function initials(n) {
    return n.replace(/[^\w\s]/gu, '').trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase() || '?';
  }

  function render(list) {
    currentList = list;
    const el = document.getElementById('list');
    if (!list.length) {
      el.innerHTML = '<div class="empty">No participants found</div>';
      return;
    }
    el.innerHTML = list.map((u, i) => `
      <div class="card" data-i="${i}">
        <div class="card-top">
          <div class="avatar">${initials(u.display_name)}</div>
          <div>
            <div class="card-name">${u.display_name || u.username}</div>
            <div class="card-user">@${u.username}</div>
          </div>
        </div>
        ${u.comment_text && u.comment_text !== '[AUTO participant]'
          ? `<div class="card-comment">${u.comment_text}</div>` : ''}
        ${u.tagged_users && u.tagged_users.length
          ? `<div class="card-tags">${u.tagged_users.map(t => `<span class="tag">@${t}</span>`).join('')}</div>` : ''}
        <div class="card-footer">
          <span class="${u.participant_status === 'manual' ? 'badge-manual' : 'badge-comment'}">${u.participant_status}</span>
          <button class="view-btn" data-i="${i}">View profile</button>
        </div>
      </div>`).join('');

    el.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', () => showSheet(currentList[+card.dataset.i]));
    });
  }

  function showSheet(u) {
    const tagsHtml = u.tagged_users && u.tagged_users.length
      ? u.tagged_users.map(t => `<span class="tag">@${t}</span>`).join('')
      : '<span style="color:#993556;font-size:13px">none</span>';
    document.getElementById('sheet-content').innerHTML = `
      <div class="sheet-header">
        <div class="sheet-avatar">${initials(u.display_name)}</div>
        <div>
          <div class="sheet-name">${u.display_name || u.username}</div>
          <div class="sheet-user">@${u.username}</div>
        </div>
      </div>
      <div class="sheet-body">
        <div class="field">
          <div class="field-lbl">Type</div>
          <div class="field-val"><span class="${u.participant_status === 'manual' ? 'badge-manual' : 'badge-comment'}">${u.participant_status}</span></div>
        </div>
        ${u.run_id ? `<div class="field"><div class="field-lbl">Run ID</div><div class="field-val">${u.run_id}</div></div>` : ''}
        ${u.comment_text && u.comment_text !== '[AUTO participant]'
          ? `<div class="field"><div class="field-lbl">Comment</div><div class="field-val" style="font-style:italic;color:#5a3848">${u.comment_text}</div></div>` : ''}
        <div class="field">
          <div class="field-lbl">Tagged friends (${u.tagged_users ? u.tagged_users.length : 0})</div>
          <div class="sheet-tags">${tagsHtml}</div>
        </div>
      </div>
      <a class="profile-btn" href="${u.profile_url}" target="_blank">Open TikTok profile</a>`;
    document.getElementById('overlay').classList.add('open');
  }

  document.getElementById('closeBtn').addEventListener('click', () => {
    document.getElementById('overlay').classList.remove('open');
  });
  document.getElementById('overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('overlay')) {
      document.getElementById('overlay').classList.remove('open');
    }
  });

  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.toLowerCase().trim();
    render(q ? users.filter(u =>
      u.username.toLowerCase().includes(q) ||
      u.display_name.toLowerCase().includes(q)
    ) : users);
  });

  async function loadUsers() {
    try {
      const res = await fetch('pkt.json');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();

      const seen = new Set();
      users = data
        .filter(u => u.review_status === 'success')
        .filter(u => {
          if (seen.has(u.username)) return false;
          seen.add(u.username);
          return true;
        });

      const commentN = users.filter(u => u.participant_status === 'comment').length;
      const manualN  = users.filter(u => u.participant_status === 'manual').length;

      document.getElementById('sub-text').textContent = users.length + ' verified participants';
      document.getElementById('stats').innerHTML =
        `<div class="stat-box"><div class="stat-num">${users.length}</div><div class="stat-lbl">Total</div></div>
         <div class="stat-box"><div class="stat-num">${commentN}</div><div class="stat-lbl">Comment</div></div>
         <div class="stat-box"><div class="stat-num">${manualN}</div><div class="stat-lbl">Auto</div></div>`;

      document.getElementById('search').disabled = false;
      render(users);

    } catch (err) {
      console.error(err);
      document.getElementById('sub-text').textContent = 'Failed to load';
      document.getElementById('list').innerHTML =
        `<div class="error">Could not load <strong>pkt.json</strong><br>Make sure it is in the same folder as this file.</div>`;
    }
  }

  loadUsers();
</script>
</body>
</html>
