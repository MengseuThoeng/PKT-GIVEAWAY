<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PKT GIVEAWAY</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <link rel="icon" href="pngkt.png" />
    <style>
      body {
        background: linear-gradient(135deg, #f9a8d4 0%, #f3e8ff 100%);
        font-family: 'Inter', sans-serif;
      }

      .fixed-height {
        max-height: 450px;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: #f472b6 #f9a8d4;
      }

      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(255, 255, 255, 0.4);
        z-index: 100;
        backdrop-filter: blur(2px);
      }

      .modal.show {
        display: flex;
      }

      .music-control {
        position: fixed;
        bottom: 30px;
        right: 30px;
        z-index: 100;
      }

      .music-control button {
        transition: all 0.3s ease;
        background: linear-gradient(45deg, #ec4899, #f472b6);
        box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
      }

      .music-control button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(236, 72, 153, 0.6);
      }

      .glass {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(12px);
        border-radius: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      .glass:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
      }

      .snowflake {
        position: fixed;
        top: -10px;
        pointer-events: none;
        color: #fff;
        opacity: 0.7;
        animation: fall linear infinite, drift ease-in-out infinite;
        filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.5));
      }

      @keyframes fall {
        from {
          transform: translateY(-10px);
        }
        to {
          transform: translateY(100vh);
        }
      }

      @keyframes drift {
        0% {
          transform: translateX(0);
        }
        50% {
          transform: translateX(20px);
        }
        100% {
          transform: translateX(0);
        }
      }

      input:focus {
        outline: none;
        ring: 2px solid #ec4899;
        border-color: #ec4899;
        box-shadow: 0 0 10px rgba(236,—” 72, 153, 0.3);
      }

      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-track {
        background: #f9a8d4;
        border-radius: 10px;
      }

      ::-webkit-scrollbar-thumb {
        background: #f472b6;
        border-radius: 10px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #ec4899;
      }
    </style>
  </head>
  <body class="min-h-screen flex items-center justify-center p-4">
    <!-- Audio Element -->
    <audio id="bgMusic" loop>
      <source src="song.mp3" type="audio/mp3" />
      Your browser does not support the audio element.
    </audio>

    <!-- Music Control Button -->
    <div class="music-control">
      <button
        id="musicToggle"
        class="rounded-full p-4 text-white shadow-lg flex items-center justify-center"
      >
        <svg
          id="playIcon"
          class="h-7 w-7"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"
          />
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
          />
        </svg>
        <svg
          id="pauseIcon"
          class="h-7 w-7 hidden"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M10 9v6m4-6v6m		"
          />
        </svg>
      </button>
    </div>

    <!-- Modal -->
    <div id="userModal" class="modal items-center justify-center">
      <div class="glass p-8 m-4 max-w-md w-full">
        <div class="flex justify-between items-center mb-6">
          <h3 class="text-2xl font-bold text-pink-600">User Details</h3>
          <button
            onclick="closeModal()"
            class="text-gray-400 hover:text-gray-600 transition"
          >
            <svg
              class="h-6 w-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>
        <div class="space-y-4 text-gray-700">
          <p class="flex items-center">
            <span class="font-semibold text-pink-600 mr-2">ID:</span>
            <span id="modalId"></span>
          </p>
          <p class="flex items-center">
            <span class="font-semibold text-pink-600 mr-2">Username:</span>
            <span id="modalUsername"></span>
          </p>
          <p class="flex items-center">
            <span class="font-semibold text-pink-600 mr-2">Full Name:</span>
            <span id="modalFullName"></span>
          </p>
          <!-- <p class="flex items-center">
            <span class="font-semibold text-pink-600 mr-2">Type:</span>
            <span id="modalType"></span>
          </p> -->
          <p class="flex items-center">
            <span class="font-semibold text-pink-600 mr-2">TikTok Link:</span>
            <a
              id="modalTikTokLink"
              href="#"
              target="_blank"
              class="text-pink-500 hover:text-pink-700 underline break-all"
            ></a>
          </p>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="w-full max-w-5xl p-8 glass">
      <img src="pngkt.png" alt="PKT Logo" class="mx-auto mb-8 w-48 h-auto" />
      <div class="mb-6">
        <label
          for="searchInput"
          class="block text-lg font-semibold text-pink-600 mb-2"
          >Search by Username</label
        >
        <div class="relative">
          <input
            type="text"
            id="searchInput"
            class="w-full border border-gray-200 rounded-xl shadow-sm focus:ring-pink-500 focus:border-pink-500 text-sm p-4 bg-white bg-opacity-50"
            placeholder="Enter username"
          />
          <svg
            class="absolute right-4 top-1/2 transform -translate-y-1/2 h-5 w-5 text-pink-400"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            />
          </svg>
        </div>
      </div>
      <div class="overflow-x-auto fixed-height rounded-xl shadow-sm">
        <table class="min-w-full divide-y divide-pink-100">
          <thead class="bg-pink-50 bg-opacity-50">
            <tr>
              <th
                scope="col"
                class="px-6 py-4 text-left text-xs font-semibold text-pink-600 uppercase tracking-wider"
              >
                No.
              </th>
              <th
                scope="col"
                class="px-6 py-4 text-left text-xs font-semibold text-pink-600 uppercase tracking-wider"
              >
                Username
              </th>
              <th
                scope="col"
                class="px-6 py-4 text-left text-xs font-semibold text-pink-600 uppercase tracking-wider"
              >
                Name
              </th>
              <th
                scope="col"
                class="px-6 py-4 text-left text-xs font-semibold text-pink-600 uppercase tracking-wider"
              >
                TikTok Link
              </th>
            </tr>
          </thead>
          <tbody id="usersTable" class="bg-white bg-opacity-50 divide-y divide-pink-100">
            <!-- User rows will be added here dynamically -->
          </tbody>
        </table>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        let i = 1;
        const usersTable = document.getElementById("usersTable");
        const searchInput = document.getElementById("searchInput");
        const modal = document.getElementById("userModal");
        let allUsers = [];

        // Add music control functionality
        const bgMusic = document.getElementById("bgMusic");
        const musicToggle = document.getElementById("musicToggle");
        const playIcon = document.getElementById("playIcon");
        const pauseIcon = document.getElementById("pauseIcon");
        let isPlaying = false;

        const createSnowflake = () => {
          const snowflake = document.createElement("div");
          snowflake.textContent = "❄";
          snowflake.classList.add("snowflake");

          const size = Math.random() * 8 + 8;
          snowflake.style.left = Math.random() * 100 + "vw";
          snowflake.style.fontSize = size + "px";
          snowflake.style.animationDuration = Math.random() * 4 + 4 + "s";
          snowflake.style.animationDelay = Math.random() * 2 + "s";

          document.body.appendChild(snowflake);

          setTimeout(() => {
            snowflake.remove();
          }, 8000);
        };

        setInterval(createSnowflake, 150);

        musicToggle.addEventListener("click", () => {
          if (isPlaying) {
            bgMusic.pause();
            playIcon.classList.remove("hidden");
            pauseIcon.classList.add("hidden");
          } else {
            bgMusic.play();
            playIcon.classList.add("hidden");
            pauseIcon.classList.remove("hidden");
          }
          isPlaying = !isPlaying;
        });

        bgMusic.volume = 0.5;

        function loadAllUsers() {
          fetch("giveaway-pkt-cambodia.users.json")
            .then((response) => response.json())
            .then((users) => {
              allUsers = users;
              displayUsers(users);
            })
            .catch((error) => console.error("Error fetching users:", error));
        }

        function displayUsers(users) {
          usersTable.innerHTML = "";
          if (users.length === 0) {
            usersTable.innerHTML = `
              <tr>
                <td colspan="5" class="px-6 py-4 text-center text-sm text-gray-500">No users found</td>
              </tr>
            `;
          } else {
            users.forEach((user, index) => {
              const row = document.createElement("tr");
              row.classList.add(
                "bg-white",
                "bg-opacity-50",
                "hover:bg-pink-50",
                "transition",
                "cursor-pointer"
              );
              row.innerHTML = `
                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${
                  index + 1
                }</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">${
                  user.username
                }</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">${
                  user.fullName
                }</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">${
                  user.tikTokLink
                }</td>
              `;
              row.addEventListener("click", () => showModal(user));
              usersTable.appendChild(row);
            });
          }
        }

        function showModal(user) {
          document.getElementById("modalId").textContent = user.id;
          document.getElementById("modalUsername").textContent = user.username;
          document.getElementById("modalFullName").textContent = user.fullName;
          // document.getElementById("modalType").textContent = user.type;
          const tikTokLink = document.getElementById("modalTikTokLink");
          tikTokLink.href = user.tikTokLink;
          tikTokLink.textContent = user.tikTokLink;
          modal.classList.add("show");
        }

        window.closeModal = function () {
          modal.classList.remove("show");
        };

        modal.addEventListener("click", (e) => {
          if (e.target === modal) {
            closeModal();
          }
        });

        function filterUsers() {
          const prefix = searchInput.value.toLowerCase();
          const filteredUsers = allUsers.filter((user) =>
            user.username.toLowerCase().includes(prefix)
          );
          displayUsers(filteredUsers);
        }

        searchInput.addEventListener("input", filterUsers);
        loadAllUsers();
      });
    </script>
  </body>
</html>
